<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TeeHee Joke Card</title>
    <style>
        /* Custom Cubic Bezier for a "bouncy" feel */
        .bounce-transition {
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .joke-container:hover .punchline {
            opacity: 1;
            transform: translateY(0);
        }

        .joke-container:hover .question-text {
            transform: translateY(-10px);
        }
    </style>
</head>
<body class="bg-amber-50 flex justify-center items-center min-h-screen p-4">

<div class="main grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

<script src="Random_Jokes.js"></script>

</body>
</html>
